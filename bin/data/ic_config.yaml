# ----------------------------------------------------------------
# THIS FILE IS AIMED AT CONFIGURING THE DYNAMIC DATA OF AN IDS
# PREVIOUSLY READ FROM THE MACHINE DESCRIPTION DATABASE... OR NOT
# ----------------------------------------------------------------

# -------------------------------------------------------------------------------------------------------
# CONFIGURATION RULES:
# --------------------
# - IF SHOT = O, IDS CREATED FROM SCRACTH, OTHERWISE IT IS READ FROM THE MD DATABASE
# - IF NO TIME ARRAY IS DEFINED FOR A SPECIFIC VARIABLE, IT USES THE GENERAL ONE INSTEAD
# - THE TIME ARRAY OF A SPECIFIC VARIABLE HAS TO BE DEFINED AFTER THE SPECIFIC VARIABLE
# --------------------
# - ADVICE: DO NOT REMOVE VARIABLES (EXCEPT TIME ARRAYS), COMMENT THEM OUT INSTEAD
# - NOTE:   THE ACCESS LAYER MAY NOT NOTICE A DIMENSION MISTAKE
# - CAVEAT: MAKE SURE THE DIMENSION OF THE VARIABLE IS THE SAME AS THE ASSOCIATED TIME ARRAY
#          (EXCEPTION: IF THE VARIABLE HAS JUST ONE VALUE, IT IS DUPLICATED OVER THE GENERAL TIME ARRAY)
# -------------------------------------------------------------------------------------------------------

ids: 'ic_antennas'

database:
   shot: 110000
   run: 1
   user: 'public'
   db: 'ITER_MD'

time: [ 0, 50, 60, 320, 350, 400 ]
#time: [ 200.]

nantenna: 1
nmodule: 1
nstrap: 2

static_variables:

    antenna[0].name: Poloidally Straight 2-Strap
    
    antenna[0].module[0].strap[0].outline.r:   [8.45, 8.45, 8.45]
    antenna[0].module[0].strap[0].outline.z:   [-0.6,  0. ,  0.6]
    antenna[0].module[0].strap[0].outline.phi: [0.]
    antenna[0].module[0].strap[0].width_tor:   0.2
    antenna[0].module[0].strap[0].distance_to_conductor: 0.2

    antenna[0].module[0].strap[1].outline.r:   [8.45, 8.45, 8.45]
    antenna[0].module[0].strap[1].outline.z:   [-0.6,  0. ,  0.6]
    antenna[0].module[0].strap[1].outline.phi: [-0.0836447165337165]
    antenna[0].module[0].strap[1].width_tor:   0.2
    antenna[0].module[0].strap[1].distance_to_conductor: 0.2

dynamic_variables:

    antenna[0].power_launched.data: [0, 0, 6.e6, 3.e6, 3.e6,0]
    #antenna[0].power_launched.data: [10.e6]
    antenna[0].frequency.data:      [50.5e6]

    antenna[0].module[0].strap[0].phase.data: [0.]
    antenna[0].module[0].strap[1].phase.data: [3.14159265]

